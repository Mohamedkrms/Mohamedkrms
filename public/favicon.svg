<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Dark Terminal Rounded Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Terminal prompt chevron '>' -->
  <path d="M24 44 L44 64 L24 84" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram 'K' -->
  <!-- Vertical stem -->
  <path d="M58 36 L58 92" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Upper diagonal branch -->
  <path d="M58 64 L86 38" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Lower diagonal branch -->
  <path d="M72 52 L94 92" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Terminal cursor dot -->
  <circle cx="104" cy="88" r="4.5" fill="#34d399" />
</svg>
